name: Kobra 3 LAN Bridge
version: "2.0.0"
slug: kobra_3_lan_bridge
description: Monitor and control Anycubic Kobra 3 printers over LAN - no cloud, no accounts.
url: https://github.com/sebmueller/kobra3-lan-bridge
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
options:
  poll_interval: 30
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: mqtt
  mqtt_pass: mqtt
  printers:
    - name: Kobra 3
      ip: 192.168.2.123
schema:
  poll_interval: int(5,3600)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_pass: password
  printers:
    - name: str
      ip: str
